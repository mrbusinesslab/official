<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MR｜服務使用成效</title><style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#282622;background:#f5f0e8}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:28px 22px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:28px}h2{font-size:22px}.panel{background:white;border:1px solid #ddd4c7;border-radius:14px;padding:22px;margin:22px 0}p{line-height:1.8}.muted{color:#67635c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.metric{padding:18px;background:#f7f4ee;border-radius:10px}.metric strong{display:block;font-size:30px;margin-top:8px}a{color:#755513}button,select,input{font:inherit;padding:10px 14px;border:1px solid #c8bca9;border-radius:8px;background:white}button{cursor:pointer}.primary{background:#292722;color:white}.hidden{display:none!important}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:540px}th,td{text-align:left;padding:12px;border-bottom:1px solid #e8e1d8}th{color:#625846}.error{color:#a52720}.empty{padding:20px;color:#67635c}.login{max-width:420px;margin:12vh auto}input{width:100%;margin:16px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.panel{padding:18px}main{padding:20px 14px}}
</style></head><body><main>
<section id="login" class="panel login"><h1>服務使用成效</h1><p>使用 MR 管理後台的密碼登入。</p><input id="password" type="password" autocomplete="current-password" aria-label="管理密碼"><button id="loginBtn" class="primary">登入</button><p id="loginError" class="error"></p></section>
<section id="app" class="hidden"><header><div><h1>服務使用成效</h1><a href="admin.html">返回 MR 管理後台</a></div><div><select id="days" aria-label="統計期間"><option value="7">近 7 天</option><option value="30" selected>近 30 天</option><option value="90">近 90 天</option></select> <button id="reload">重新整理</button> <button id="logout">登出</button></div></header>
<p id="notice" class="muted">載入中…</p>
<section class="panel"><h2>傑哥｜估價單產生器</h2><p class="muted">只計算按下正式產生按鈕後的系統產出；即時預覽不列入。產出完成不代表使用者已儲存或交付客戶。</p><div id="quoteMetrics" class="grid"></div></section>
<section class="panel"><h2>AI 秘書｜後端操作</h2><p class="muted">記錄待辦、日曆與工程功能的後端請求。後端回應完成不等於任務內容正確、LINE 回覆送達或提醒準時。尚未包含主機逾時與完整對話流程。</p><div id="lifeosMetrics" class="grid"></div><div class="table-wrap"><table><thead><tr><th>功能</th><th>請求次數</th><th>後端失敗</th><th>平均耗時</th></tr></thead><tbody id="operations"></tbody></table></div></section>
<section class="panel"><h2>每日紀錄</h2><div class="table-wrap"><table><thead><tr><th>台灣日期</th><th>系統</th><th>功能</th><th>結果</th><th>次數</th><th>平均耗時</th></tr></thead><tbody id="daily"></tbody></table></div></section>
<p class="muted">從安裝後開始累積；測試紀錄不列入。製作前的人工耗時、修改次數與節省時間尚無可靠紀錄，不作推算。</p></section>
</main><script src="service-usage.js?v=20261126-1"></script></body></html>
