<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MR 管理者後台｜電子名片數據</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>:root{--bg:#f5f3ef;--card:#fff;--ink:#242321;--muted:#77736d;--line:#dedad3;--dark:#2d2b28;--good:#2d7d5b;--bad:#b5534b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);padding:38px;border-radius:18px;box-shadow:0 16px 50px #0001}.brand{font-weight:800;letter-spacing:.08em;font-size:24px}.sub{color:var(--muted);margin:8px 0 26px}.login input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}.primary{width:100%;border:0;background:var(--dark);color:#fff;border-radius:10px;padding:14px}.error{color:var(--bad);font-size:14px;margin-top:10px}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar small{color:var(--muted)}.logout,.action{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.action.dark{background:var(--dark);color:#fff}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 68px)}.side{padding:24px 16px;background:#292825;color:#fff}.side h4{margin:0 10px 18px;color:#c7b78f}.nav{padding:12px 14px;border-radius:9px;background:#ffffff1a;font-weight:700}.main{padding:28px;max-width:1600px;width:100%;margin:auto}.headrow h1{margin:0;font-size:28px}.headrow p{margin:7px 0 20px;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}.filters select,.filters input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px}.export-wrap{margin-left:auto;display:flex;gap:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.metric{padding:18px}.metric span{color:var(--muted);font-size:14px}.metric strong{display:block;font-size:30px;margin-top:7px}.compare{font-size:13px;margin-top:5px}.up{color:var(--good)}.down{color:var(--bad)}.panel{padding:18px;margin-bottom:18px}.panel-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel-title h3{margin:0}.chartbox{height:310px}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:900px}.data-table th,.data-table td{padding:12px 10px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}.data-table th:first-child,.data-table td:first-child{text-align:left}.data-table th{font-size:13px;color:var(--muted)}.person-link{font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#eee;margin-right:8px;font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;border-radius:16px;width:min(1100px,100%);max-height:92vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:16px}.modal-head h2{margin:0}.close{border:0;background:#eee;border-radius:50%;width:34px;height:34px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.pdf-stage{position:fixed;left:-99999px;top:0;width:1100px;background:#fff;padding:34px}.pdf-stage table{width:100%;border-collapse:collapse}.pdf-stage th,.pdf-stage td{border-bottom:1px solid #ddd;padding:9px;text-align:right}.pdf-stage th:first-child,.pdf-stage td:first-child{text-align:left}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.cards,.detail-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){.cards,.detail-grid{grid-template-columns:1fr}.filters>*{width:100%}.export-wrap{margin-left:0;width:100%}.export-wrap button{flex:1}}</style></head><body>
<section id="login" class="login"><div class="login-card"><div class="brand">MR. ADMIN</div><div class="sub">管理者後台｜電子名片數據</div><input id="password" type="password" placeholder="輸入管理密碼"><button class="primary" id="loginBtn">登入</button><div class="error hidden" id="loginError">密碼錯誤，請重新輸入。</div></div></section>
<section id="app" class="hidden"><header class="topbar"><div><b>MR. 管理者後台</b> <small>／電子名片數據</small></div><button class="logout" id="logoutBtn">登出</button></header><div class="layout"><aside class="side"><h4>MANAGEMENT</h4><div class="nav">電子名片數據</div></aside><main class="main"><div class="headrow"><h1>電子名片數據總覽</h1><p id="rangeText">載入中…</p></div>
<div class="filters"><select id="preset"><option value="month">本月</option><option value="today">今日</option><option value="lastMonth">上個月</option><option value="30">近 30 天</option><option value="60">近 60 天</option><option value="90">近 90 天</option><option value="custom">自訂日期</option></select><input type="date" id="startDate" class="hidden"><span id="toText" class="hidden">～</span><input type="date" id="endDate" class="hidden"><select id="sortBy"><option value="clicks">點擊最高</option><option value="views">瀏覽最高</option><option value="shares">分享最高</option><option value="rate">互動率最高</option></select><div class="export-wrap"><button class="action" id="exportExcel">匯出 Excel</button><button class="action dark" id="exportPdf">匯出 PDF</button></div></div>
<section class="cards"><div class="metric"><span>名片瀏覽</span><strong id="mViews">0</strong><div class="compare" id="cViews">—</div></div><div class="metric"><span>總按鈕點擊</span><strong id="mClicks">0</strong><div class="compare" id="cClicks">—</div></div><div class="metric"><span>分享</span><strong id="mShares">0</strong><div class="compare" id="cShares">—</div></div><div class="metric"><span>互動率</span><strong id="mRate">0%</strong><div class="compare" id="cRate">—</div></div></section>
<section class="panel"><div class="panel-title"><h3>數據趨勢</h3><span id="trendLabel"></span></div><div class="chartbox"><canvas id="trendChart"></canvas></div></section>
<section class="panel"><div class="panel-title"><h3>人物排行</h3><span>點人物查看詳細資料</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>人物</th><th>瀏覽</th><th>總點擊</th><th>分享</th><th>互動率</th><th>較前期</th><th>最後更新時間</th></tr></thead><tbody id="peopleBody"></tbody></table></div><div id="empty" class="empty hidden">目前選擇的期間還沒有正式數據。</div></section></main></div></section>
<div id="personModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><h2 id="personName">人物</h2><p id="personRange"></p></div><div><button class="action" id="personExcel">Excel</button> <button class="action dark" id="personPdf">PDF</button> <button class="close" id="closeModal">×</button></div></div><div class="detail-grid"><div class="metric"><span>瀏覽</span><strong id="pViews">0</strong></div><div class="metric"><span>點擊</span><strong id="pClicks">0</strong></div><div class="metric"><span>分享</span><strong id="pShares">0</strong></div><div class="metric"><span>互動率</span><strong id="pRate">0%</strong></div></div><div class="panel"><h3>每日趨勢</h3><div class="chartbox"><canvas id="personChart"></canvas></div></div><h3>按鈕明細</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>頁面</th><th>按鈕</th><th>名稱</th><th>點擊數</th></tr></thead><tbody id="buttonBody"></tbody></table></div></div></div><div id="pdfStage" class="pdf-stage"></div>
<script>
const API='https://packaiwgsswrjvxdsejw.supabase.co/functions/v1/card-analytics-dashboard', $=s=>document.querySelector(s);let allRows=[],trendChart=null,personChart=null,currentPeople=[],currentDetail=null,currentRange=null;const tzDate=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const tzTime=d=>new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);function parseTaipei(s){return new Date(s+'T00:00:00+08:00')}function addDays(d,n){return new Date(d.getTime()+n*86400000)}function fmt(d){return tzDate(d)}function n(v){return Number(v||0).toLocaleString('zh-TW')}function pct(v){return Number(v||0).toFixed(1)+'%'}function token(){return localStorage.getItem('mr_admin_token')||''}function showApp(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadData()}function showLogin(){$('#app').classList.add('hidden');$('#login').classList.remove('hidden')}
async function login(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:$('#password').value})});if(!r.ok){$('#loginError').classList.remove('hidden');return}const j=await r.json();localStorage.setItem('mr_admin_token',j.token);localStorage.setItem('mr_admin_exp',String(Date.now()+30*86400000));showApp()}async function loadData(){const r=await fetch(API+'?days=365',{headers:{Authorization:'Bearer '+token()}});if(r.status===401){localStorage.clear();showLogin();return}const j=await r.json();allRows=j.rows||[];render()}
function getRange(){const now=parseTaipei(tzDate(new Date())),p=$('#preset').value;let start,end=now;if(p==='today')start=now;else if(p==='month')start=new Date(now.getFullYear(),now.getMonth(),1);else if(p==='lastMonth'){start=new Date(now.getFullYear(),now.getMonth()-1,1);end=new Date(now.getFullYear(),now.getMonth(),0)}else if(['30','60','90'].includes(p))start=addDays(now,-Number(p)+1);else{start=parseTaipei($('#startDate').value||fmt(now));end=parseTaipei($('#endDate').value||fmt(now));if(start>end)[start,end]=[end,start]}const len=Math.round((end-start)/86400000)+1,prevEnd=addDays(start,-1),prevStart=addDays(prevEnd,-len+1);return{start,end,prevStart,prevEnd,len}}
function rowsBetween(start,end,caseId){const a=start.getTime(),b=addDays(end,1).getTime();return allRows.filter(r=>{const t=new Date(r.occurred_at).getTime();return t>=a&&t<b&&(!caseId||r.case_id===caseId)&&r.is_test!==true})}
function aggregate(rows){const map={};let views=0,clicks=0,shares=0;for(const r of rows){views+=r.event_type==='card_view';clicks+=r.event_type==='button_click';shares+=r.event_type==='share';if(!map[r.case_id])map[r.case_id]={case_id:r.case_id,name:r.person_name||r.case_id,views:0,clicks:0,shares:0,buttons:{},latest:null};const p=map[r.case_id];p.views+=r.event_type==='card_view';p.clicks+=r.event_type==='button_click';p.shares+=r.event_type==='share';if(!p.latest||new Date(r.occurred_at)>new Date(p.latest))p.latest=r.occurred_at;if(r.event_type==='button_click'){const k=`${r.page_no||0}|${r.button_position||''}|${r.button_label||''}`;p.buttons[k]=(p.buttons[k]||0)+1}}for(const p of Object.values(map))p.rate=p.views?p.clicks/p.views*100:0;return{views,clicks,shares,rate:views?clicks/views*100:0,people:Object.values(map)}}
function compare(c,p){if(p===0)return c===0?'—':'前期 0';const d=(c-p)/p*100;return`${d>=0?'▲':'▼'} ${Math.abs(d).toFixed(1)}%`}function compEl(e,c,p){e.textContent=compare(c,p);e.className='compare '+(c>p?'up':c<p?'down':'')}function daily(rows,start,end){const out=[];for(let d=new Date(start);d<=end;d=addDays(d,1))out.push({date:fmt(d),views:0,clicks:0,shares:0});const m=Object.fromEntries(out.map(x=>[x.date,x]));for(const r of rows){const k=tzDate(new Date(r.occurred_at));if(m[k]){m[k].views+=r.event_type==='card_view';m[k].clicks+=r.event_type==='button_click';m[k].shares+=r.event_type==='share'}}return out}
function drawTrend(rows,range,person=false){const data=daily(rows,range.start,range.end),ctx=$(person?'#personChart':'#trendChart');if(person&&personChart)personChart.destroy();if(!person&&trendChart)trendChart.destroy();const ch=new Chart(ctx,{type:'line',data:{labels:data.map(x=>x.date.slice(5)),datasets:[{label:'瀏覽',data:data.map(x=>x.views),tension:.25},{label:'點擊',data:data.map(x=>x.clicks),tension:.25},{label:'分享',data:data.map(x=>x.shares),tension:.25}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true}}}});if(person)personChart=ch;else trendChart=ch}
function render(){currentRange=getRange();const curRows=rowsBetween(currentRange.start,currentRange.end),prevRows=rowsBetween(currentRange.prevStart,currentRange.prevEnd),cur=aggregate(curRows),prev=aggregate(prevRows);$('#rangeText').textContent=`${fmt(currentRange.start)} ～ ${fmt(currentRange.end)}｜對比 ${fmt(currentRange.prevStart)} ～ ${fmt(currentRange.prevEnd)}`;$('#trendLabel').textContent=`${currentRange.len} 天`;$('#mViews').textContent=n(cur.views);$('#mClicks').textContent=n(cur.clicks);$('#mShares').textContent=n(cur.shares);$('#mRate').textContent=pct(cur.rate);compEl($('#cViews'),cur.views,prev.views);compEl($('#cClicks'),cur.clicks,prev.clicks);compEl($('#cShares'),cur.shares,prev.shares);compEl($('#cRate'),cur.rate,prev.rate);const prevMap=Object.fromEntries(prev.people.map(p=>[p.case_id,p])),sort=$('#sortBy').value,key=sort==='views'?'views':sort==='shares'?'shares':sort==='rate'?'rate':'clicks';currentPeople=cur.people.sort((a,b)=>b[key]-a[key]);const body=$('#peopleBody');body.innerHTML='';$('#empty').classList.toggle('hidden',currentPeople.length>0);currentPeople.forEach((p,i)=>{const pp=prevMap[p.case_id]||{views:0,clicks:0,shares:0,rate:0},tr=document.createElement('tr');tr.innerHTML=`<td><span class="rank">${i+1}</span><span class="person-link" data-id="${p.case_id}">${p.name}</span></td><td>${n(p.views)}</td><td>${n(p.clicks)}</td><td>${n(p.shares)}</td><td>${pct(p.rate)}</td><td>${compare(p[key],pp[key])}</td><td>${p.latest?tzTime(new Date(p.latest)):'—'}</td>`;body.appendChild(tr)});document.querySelectorAll('.person-link').forEach(x=>x.onclick=()=>openPerson(x.dataset.id));drawTrend(curRows,currentRange)}
function openPerson(id){const rows=rowsBetween(currentRange.start,currentRange.end,id),agg=aggregate(rows),p=agg.people[0]||{case_id:id,name:id,views:0,clicks:0,shares:0,rate:0,buttons:{}};currentDetail={p,rows};$('#personName').textContent=p.name;$('#personRange').textContent=`${fmt(currentRange.start)} ～ ${fmt(currentRange.end)}`;$('#pViews').textContent=n(p.views);$('#pClicks').textContent=n(p.clicks);$('#pShares').textContent=n(p.shares);$('#pRate').textContent=pct(p.rate);const b=$('#buttonBody');b.innerHTML='';Object.entries(p.buttons||{}).map(([k,count])=>{const [page,pos,label]=k.split('|');return{page:Number(page),pos,label,count}}).sort((a,z)=>a.page-z.page||a.pos.localeCompare(z.pos)).forEach(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td>第 ${x.page} 頁</td><td>${x.pos.replace('button','按鈕 ')}</td><td>${x.label||'—'}</td><td>${n(x.count)}</td>`;b.appendChild(tr)});$('#personModal').classList.remove('hidden');drawTrend(rows,currentRange,true)}
function summaryRows(){return currentPeople.map((p,i)=>({'排名':i+1,'人物':p.name,'名片瀏覽':p.views,'總按鈕點擊':p.clicks,'分享':p.shares,'互動率(%)':Number(p.rate.toFixed(1)),'最後更新時間':p.latest?tzTime(new Date(p.latest)):'—'}))}function exportXlsx(personOnly=false){const wb=XLSX.utils.book_new();if(personOnly&&currentDetail){const p=currentDetail.p;XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([{'人物':p.name,'期間':`${fmt(currentRange.start)} ~ ${fmt(currentRange.end)}`,'瀏覽':p.views,'點擊':p.clicks,'分享':p.shares,'互動率(%)':Number(p.rate.toFixed(1)),'最後更新時間':p.latest?tzTime(new Date(p.latest)):'—'}]),'摘要');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(daily(currentDetail.rows,currentRange.start,currentRange.end)),'每日趨勢');XLSX.writeFile(wb,`MR_${p.name}_${fmt(currentRange.start)}_${fmt(currentRange.end)}.xlsx`)}else{XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summaryRows()),'總覽');XLSX.writeFile(wb,`MR_電子名片數據_${fmt(currentRange.start)}_${fmt(currentRange.end)}.xlsx`)}}
async function exportPdf(personOnly=false){const stage=$('#pdfStage');if(personOnly&&currentDetail){const p=currentDetail.p;stage.innerHTML=`<h1>${p.name}｜電子名片數據</h1><p>${fmt(currentRange.start)} ～ ${fmt(currentRange.end)}</p><table><tbody><tr><td>瀏覽</td><td>${p.views}</td></tr><tr><td>總點擊</td><td>${p.clicks}</td></tr><tr><td>分享</td><td>${p.shares}</td></tr><tr><td>互動率</td><td>${pct(p.rate)}</td></tr><tr><td>最後更新</td><td>${p.latest?tzTime(new Date(p.latest)):'—'}</td></tr></tbody></table>`}else stage.innerHTML=`<h1>MR 電子名片數據總覽</h1><p>${fmt(currentRange.start)} ～ ${fmt(currentRange.end)}</p><table><thead><tr><th>人物</th><th>瀏覽</th><th>點擊</th><th>分享</th><th>互動率</th><th>最後更新</th></tr></thead><tbody>${currentPeople.map(p=>`<tr><td>${p.name}</td><td>${p.views}</td><td>${p.clicks}</td><td>${p.shares}</td><td>${pct(p.rate)}</td><td>${p.latest?tzTime(new Date(p.latest)):'—'}</td></tr>`).join('')}</tbody></table>`;const canvas=await html2canvas(stage,{scale:2,backgroundColor:'#fff'}),img=canvas.toDataURL('image/jpeg',.95),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),w=190,h=canvas.height*190/canvas.width;pdf.addImage(img,'JPEG',10,10,w,h);pdf.save(personOnly&&currentDetail?`MR_${currentDetail.p.name}.pdf`:`MR_電子名片數據.pdf`)}
$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#logoutBtn').onclick=()=>{localStorage.removeItem('mr_admin_token');localStorage.removeItem('mr_admin_exp');location.reload()};$('#preset').onchange=()=>{const c=$('#preset').value==='custom';$('#startDate').classList.toggle('hidden',!c);$('#endDate').classList.toggle('hidden',!c);$('#toText').classList.toggle('hidden',!c);render()};$('#sortBy').onchange=render;$('#startDate').onchange=render;$('#endDate').onchange=render;$('#closeModal').onclick=()=>$('#personModal').classList.add('hidden');$('#exportExcel').onclick=()=>exportXlsx(false);$('#exportPdf').onclick=()=>exportPdf(false);$('#personExcel').onclick=()=>exportXlsx(true);$('#personPdf').onclick=()=>exportPdf(true);const exp=Number(localStorage.getItem('mr_admin_exp')||0);if(token()&&exp>Date.now())showApp();else showLogin();
</script></body></html>
